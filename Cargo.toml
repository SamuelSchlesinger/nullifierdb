[package]
name = "nullifierdb"
version = "0.1.0"
edition = "2024"
description = "A specialized database for storing and validating cryptographic nullifiers"
license = "Apache-2.0"
repository = "https://github.com/SamuelSchlesinger/nullifierdb"
readme = "README.md"
keywords = ["database", "cryptography", "nullifier", "zk-proof", "blockchain"]
categories = ["database-implementations", "cryptography"]

[dependencies]
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
log = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "minwindef", "minwinbase"] }

[dev-dependencies]
tempfile = "3.9"
rand = "0.8"
criterion = "0.5"

[[bench]]
name = "nullifier_benchmarks"
harness = false
